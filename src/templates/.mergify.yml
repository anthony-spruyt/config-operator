merge_queue:
  # This repo pushes sync commits to main on a schedule. The default behaviour
  # discards every in-flight speculative check when that happens, so a run of
  # queued PRs can restart indefinitely and never drain.
  reset_on_external_merge: never

queue_rules:
  # auto_merge_conditions queues via merge protections, which always uses this
  # queue, so the release-please exception has to live here rather than in a
  # queue of its own.
  - name: default
    merge_method: squash
    batch_size: 1
    max_checks_retries: 3
    merge_conditions:
      - -draft
      - "check-success = summary / Check Results"
      - or:
          - "#approved-reviews-by >= 1"
          - and:
              - "label=autorelease: pending"
              - author = repo-operator-release-bot[bot]

priority_rules:
  - name: revert PRs
    conditions:
      - label = agent/revert
    priority: high
    allow_checks_interruption: true
  - name: emergency merge
    conditions:
      - label = emergency/merge
    priority: high
    allow_checks_interruption: true

pull_request_rules:
  - name: auto-merge approved PRs
    conditions:
      - "#approved-reviews-by >= 1"
      - -label = blocked
      - -draft
      - -merged
    actions:
      queue: {}

  - name: auto-merge revert PRs
    conditions:
      - label = agent/revert
      - "author~=.*\\[bot\\]$"
      - -label = blocked
      - -merged
    actions:
      queue: {}

  - name: auto-merge release-please PRs
    conditions:
      - "label=autorelease: pending"
      - author = repo-operator-release-bot[bot]
      - "head~=^release-please--branches--"
      - "files~=^\\.release-please-manifest\\.json$"
      - -label = blocked
      - -draft
      - -merged
    actions:
      queue: {}

  - name: emergency merge (break glass)
    conditions:
      - label = emergency/merge
      - author = anthony-spruyt
      - -label = blocked
      - -draft
      - -merged
    actions:
      queue: {}

  - name: cleanup labels on close
    conditions:
      - closed
      - -merged
    actions:
      label:
        remove:
          - agent/triage
          - agent/fixing
          - agent/fixable
          - agent/needs-review

merge_protections:
  - name: default
    if:
      - base = main
      - -label = agent/revert
      - -label = emergency/merge
      - "-label=autorelease: pending"
    success_conditions:
      - "#approved-reviews-by >= 1"

  - name: release-please
    if:
      - base = main
      - "label=autorelease: pending"
    success_conditions:
      - author = repo-operator-release-bot[bot]
      - "head~=^release-please--branches--"
      - "files~=^\\.release-please-manifest\\.json$"

  - name: revert-approved
    if:
      - base = main
      - label = agent/revert
    success_conditions:
      - "author~=.*\\[bot\\]$"

  - name: emergency-merge
    if:
      - base = main
      - label = emergency/merge
    success_conditions:
      - author = anthony-spruyt

merge_protections_settings:
  reporting_method: check-runs
  auto_merge_conditions: true
